<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add a Book — Book Club</title>
  <link rel="icon" type="image/x-icon" href="/bookclub/favicon.ico">
  <link rel="stylesheet" href="style.css" />
  <style>
    /* Scoped styles for this page only — everything else (nav, footer, fonts,
       colors) is inherited from your existing style.css so this matches the
       rest of the site automatically. */
    #add-book-main { max-width: 640px; }

    .connect-note {
      font-size: 0.85em;
      padding: 10px 14px;
      border-radius: 6px;
      margin-bottom: 20px;
      border: 1px solid rgba(128,128,128,0.35);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .connect-note.connected { border-color: rgba(60,160,90,0.5); }
    .connect-note button {
      font-size: 0.85em;
      padding: 4px 10px;
      cursor: pointer;
      border-radius: 4px;
      border: 1px solid rgba(128,128,128,0.4);
      background: transparent;
    }

    #book-form { display: grid; gap: 14px; margin-top: 10px; }
    #book-form .row { display: grid; gap: 14px; grid-template-columns: 1fr 1fr; }
    #book-form label {
      display: block;
      font-size: 0.8em;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      opacity: 0.7;
      margin-bottom: 4px;
    }
    #book-form input {
      width: 100%;
      padding: 8px 10px;
      border-radius: 5px;
      border: 1px solid rgba(128,128,128,0.4);
      background: rgba(128,128,128,0.06);
      font: inherit;
      color: inherit;
    }
    #book-form input:focus { outline: 2px solid rgba(90,140,220,0.6); outline-offset: 1px; }

    .isbn-row { display: flex; gap: 8px; align-items: flex-end; }
    .isbn-row > div { flex: 1; }
    #lookup-btn, #submit-btn {
      padding: 9px 16px;
      border-radius: 5px;
      border: 1px solid rgba(128,128,128,0.4);
      background: rgba(128,128,128,0.08);
      font: inherit;
      cursor: pointer;
      white-space: nowrap;
    }
    #submit-btn { border-color: transparent; background: #3c6e47; color: #fff; font-weight: 600; }
    #submit-btn:disabled, #lookup-btn:disabled { opacity: 0.5; cursor: default; }

    #lookup-msg { font-size: 0.85em; opacity: 0.75; min-height: 1.2em; margin-top: -6px; }
    #lookup-msg.error { color: #b3413c; opacity: 1; }
    #form-status { font-size: 0.9em; margin-top: 4px; min-height: 1.2em; }
    #form-status.ok { color: #3c8a52; }
    #form-status.err { color: #b3413c; }

    dialog#settings-dialog { border-radius: 8px; border: 1px solid rgba(128,128,128,0.4); max-width: 420px; width: 90%; padding: 20px; }
    dialog#settings-dialog label { margin-top: 12px; }
    dialog#settings-dialog .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }

    @media (max-width: 560px) { #book-form .row { grid-template-columns: 1fr; } }
  </style>
</head>
<body id="top">

  <nav>
    <a href="index.html" class="nav-brand">📖 Book Club</a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="books.html">Books</a>
      <a href="stats.html">Stats</a>
      <a href="add.html" class="active">Add a Book</a>
    </div>
  </nav>

  <main id="add-book-main">
    <h1>Add a Book</h1>

    <div class="connect-note" id="connect-note">
      <span id="connect-label">Not connected to GitHub yet.</span>
      <button type="button" id="settings-btn">Connect</button>
    </div>

    <form id="book-form" autocomplete="off">
      <div class="isbn-row">
        <div>
          <label for="f-isbn">ISBN</label>
          <input id="f-isbn" type="text" placeholder="9780670026197">
        </div>
        <button type="button" id="lookup-btn">Look up</button>
      </div>
      <div id="lookup-msg"></div>

      <div>
        <label for="f-title">Title *</label>
        <input id="f-title" type="text" required placeholder="A Gentleman in Moscow">
      </div>

      <div class="row">
        <div>
          <label for="f-author">Author *</label>
          <input id="f-author" type="text" required placeholder="Amor Towles">
        </div>
        <div>
          <label for="f-goodreads">Goodreads URL</label>
          <input id="f-goodreads" type="text" placeholder="auto-filled from ISBN">
        </div>
      </div>

      <div class="row">
        <div>
          <label for="f-genre">Genre</label>
          <input id="f-genre" type="text" list="genre-list" placeholder="Fiction">
          <datalist id="genre-list"><option value="Fiction"><option value="Nonfiction"></datalist>
        </div>
        <div>
          <label for="f-subgenre">Sub-Genre</label>
          <input id="f-subgenre" type="text" list="subgenre-list" placeholder="Historical Fiction">
          <datalist id="subgenre-list">
            <option value="Historical Fiction"><option value="Mystery">
            <option value="Contemporary"><option value="Contemporary Fiction">
            <option value="Domestic Fiction"><option value="Political Fiction">
            <option value="Psychological Fiction"><option value="Romance">
            <option value="Literary Fiction"><option value="Biography">
            <option value="Memoir"><option value="Book Club"><option value="True Crime">
          </datalist>
        </div>
      </div>

      <div class="row">
        <div>
          <label for="f-published">Date Published</label>
          <input id="f-published" type="date">
        </div>
        <div>
          <label for="f-year">Year Published</label>
          <input id="f-year" type="text" placeholder="2016">
        </div>
      </div>

      <div class="row">
        <div>
          <label for="f-meeting">Meeting Date</label>
          <input id="f-meeting" type="date">
        </div>
        <div>
          <label for="f-host">Host</label>
          <input id="f-host" type="text" placeholder="Carrie & Christine">
        </div>
      </div>

      <div>
        <label for="f-location">Location</label>
        <input id="f-location" type="text" placeholder="Carrie's house">
      </div>

      <div>
        <button type="submit" id="submit-btn">Add to the list</button>
        <span id="form-status"></span>
      </div>
    </form>
  </main>

  <footer>
    <p>&copy; 2026 Book Club</p>
  </footer>

  <dialog id="settings-dialog">
    <h2 style="margin-top:0;">Connect to GitHub</h2>
    <p style="font-size:0.85em; opacity:0.75;">Paste in the Worker URL and shared secret from your setup (see SETUP.md). This is saved in your browser only — it isn't part of the site.</p>
    <label for="s-worker">Worker URL</label>
    <input id="s-worker" type="text" placeholder="https://bookclub-add-book.you.workers.dev" style="width:100%; padding:8px; border-radius:5px; border:1px solid rgba(128,128,128,0.4);">
    <label for="s-secret">Shared secret</label>
    <input id="s-secret" type="password" placeholder="the password you set in the Worker" style="width:100%; padding:8px; border-radius:5px; border:1px solid rgba(128,128,128,0.4);">
    <div class="actions">
      <button type="button" id="settings-cancel">Cancel</button>
      <button type="button" id="settings-save" style="background:#3c6e47; color:#fff; border:none;">Save</button>
    </div>
  </dialog>

  <script>
  (function(){
    const $ = (s) => document.querySelector(s);
    const LS_KEY = 'bookclub_add_settings'; // plain localStorage — this page is served from your own domain, not a Claude artifact
    let settings = { workerUrl:'', sharedSecret:'' };

    function loadSettings(){
      try{
        const raw = localStorage.getItem(LS_KEY);
        if(raw) settings = JSON.parse(raw);
      }catch(e){}
      updateConnectNote();
    }
    function saveSettings(){
      localStorage.setItem(LS_KEY, JSON.stringify(settings));
      updateConnectNote();
    }
    function updateConnectNote(){
      const note = $('#connect-note');
      const label = $('#connect-label');
      if(settings.workerUrl && settings.sharedSecret){
        note.classList.add('connected');
        label.textContent = 'Connected — new books publish straight to GitHub.';
        $('#settings-btn').textContent = 'Edit connection';
      } else {
        note.classList.remove('connected');
        label.textContent = 'Not connected to GitHub yet — set up your Worker first.';
        $('#settings-btn').textContent = 'Connect';
      }
    }

    const dialog = $('#settings-dialog');
    $('#settings-btn').addEventListener('click', () => {
      $('#s-worker').value = settings.workerUrl;
      $('#s-secret').value = settings.sharedSecret;
      dialog.showModal();
    });
    $('#settings-cancel').addEventListener('click', () => dialog.close());
    $('#settings-save').addEventListener('click', () => {
      settings.workerUrl = $('#s-worker').value.trim().replace(/\/$/,'');
      settings.sharedSecret = $('#s-secret').value.trim();
      saveSettings();
      dialog.close();
    });

    // ---------- ISBN lookup ----------
    // Open Library's dedicated ISBN endpoint first (Google's "isbn:" search
    // operator is notoriously unreliable and often returns nothing even for
    // valid ISBNs) — Google Books is used only as a fallback.
    async function lookupOpenLibrary(isbn){
      const res = await fetch(`https://openlibrary.org/api/books?bibkeys=ISBN:${isbn}&format=json&jscmd=data`);
      const json = await res.json();
      const data = json['ISBN:' + isbn];
      if(!data) return null;
      return {
        title: data.title || '',
        authors: (data.authors || []).map(a => a.name).filter(Boolean).join(', '),
        publishDate: data.publish_date || '',
        subject: (data.subjects && data.subjects[0] && (data.subjects[0].name || data.subjects[0])) || ''
      };
    }
    async function lookupGoogleBooks(isbn){
      const res = await fetch(`https://www.googleapis.com/books/v1/volumes?q=isbn:${isbn}`);
      const json = await res.json();
      const info = json.items && json.items[0] && json.items[0].volumeInfo;
      if(!info) return null;
      return {
        title: info.title || '',
        authors: (info.authors || []).join(', '),
        publishDate: info.publishedDate || '',
        subject: (info.categories && info.categories[0]) || ''
      };
    }
    // Loose date strings ("September 6, 2016", "2016", "6 Sep 2016") -> {iso, year}
    function parseLooseDate(str){
      if(!str) return { iso:'', year:'' };
      const yearMatch = str.match(/\d{4}/);
      const year = yearMatch ? yearMatch[0] : '';
      const d = new Date(str);
      if(!isNaN(d.getTime())){
        return { iso: d.toISOString().slice(0,10), year: year || String(d.getFullYear()) };
      }
      return { iso: year ? year + '-01-01' : '', year };
    }

    $('#lookup-btn').addEventListener('click', async function(){
      const isbn = $('#f-isbn').value.replace(/[^0-9Xx]/g,'');
      const msg = $('#lookup-msg');
      if(!isbn){ msg.textContent = 'Enter an ISBN first.'; msg.classList.add('error'); return; }
      const btn = $('#lookup-btn');
      btn.disabled = true; btn.textContent = 'Looking up…';
      msg.classList.remove('error');
      msg.textContent = 'Searching Open Library…';
      let info = null;
      try{
        info = await lookupOpenLibrary(isbn);
      }catch(e){ /* fall through to Google Books */ }

      if(!info){
        msg.textContent = 'Trying Google Books…';
        try{
          info = await lookupGoogleBooks(isbn);
        }catch(e){ /* fall through to "no match" */ }
      }

      $('#f-goodreads').value = `https://www.goodreads.com/book/isbn/${isbn}`;

      if(!info){
        msg.textContent = 'No match found in Open Library or Google Books — fill in details manually.';
        msg.classList.add('error');
      } else {
        if(!$('#f-title').value) $('#f-title').value = info.title;
        if(!$('#f-author').value) $('#f-author').value = info.authors;
        if(info.publishDate){
          const { iso, year } = parseLooseDate(info.publishDate);
          if(!$('#f-published').value && iso) $('#f-published').value = iso;
          if(!$('#f-year').value && year) $('#f-year').value = year;
        }
        if(!$('#f-genre').value && info.subject) $('#f-genre').value = info.subject;
        msg.textContent = `Found "${info.title}" — check the fields below.`;
      }
      btn.disabled = false; btn.textContent = 'Look up';
    });
    $('#f-published').addEventListener('change', function(){
      if(this.value && !$('#f-year').value) $('#f-year').value = this.value.slice(0,4);
    });

    function isoToUS(iso){
      if(!iso) return '';
      const [y,m,d] = iso.split('-');
      return `${parseInt(m,10)}/${parseInt(d,10)}/${y}`;
    }

    // ---------- submit ----------
    $('#book-form').addEventListener('submit', async function(e){
      e.preventDefault();
      const status = $('#form-status');
      status.className = ''; status.textContent = '';

      if(!settings.workerUrl || !settings.sharedSecret){
        status.className = 'err';
        status.textContent = 'Connect to GitHub first (button above).';
        return;
      }

      const book = {
        title: $('#f-title').value.trim(),
        author: $('#f-author').value.trim(),
        genre: $('#f-genre').value.trim(),
        subGenre: $('#f-subgenre').value.trim(),
        datePublished: $('#f-published').value ? isoToUS($('#f-published').value) : '',
        yearPublished: $('#f-year').value.trim(),
        meetingDate: $('#f-meeting').value ? isoToUS($('#f-meeting').value) : '',
        host: $('#f-host').value.trim(),
        location: $('#f-location').value.trim(),
        isbn: $('#f-isbn').value.trim(),
        goodreadsUrl: $('#f-goodreads').value.trim(),
      };
      if(!book.title || !book.author) return;

      const btn = $('#submit-btn');
      btn.disabled = true; btn.textContent = 'Publishing…';
      try{
        const res = await fetch(settings.workerUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-shared-secret': settings.sharedSecret },
          body: JSON.stringify({ book })
        });
        const json = await res.json();
        if(!res.ok || !json.ok) throw new Error(json.error || `Request failed (${res.status})`);
        $('#book-form').reset();
        $('#lookup-msg').textContent = '';
        status.className = 'ok';
        status.textContent = `Added "${book.title}" — it'll show up on the Books page (instantly, or after the next site rebuild).`;
      }catch(err){
        status.className = 'err';
        status.textContent = 'Could not publish: ' + err.message;
      }finally{
        btn.disabled = false; btn.textContent = 'Add to the list';
      }
    });

    loadSettings();
  })();
  </script>
</body>
</html>
